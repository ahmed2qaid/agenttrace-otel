[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrace-otel"
version = "0.1.0"
description = "OpenTelemetry-native trajectory tracing and diffing for AI agents"
requires-python = ">=3.11"
dependencies = ["opentelemetry-api>=1.27.0"]
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
