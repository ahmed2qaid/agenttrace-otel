[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrace-otel"
version = "0.3.0"
description = "OpenTelemetry-native tracing, replay, trajectory assertions, and regression gates for AI agents"
requires-python = ">=3.11"
dependencies = ["opentelemetry-api>=1.27.0"]
license = {text = "MIT"}

[project.optional-dependencies]
openai = ["openai-agents>=0.22,<1"]
mcp = ["mcp>=2.1,<3"]
all = ["openai-agents>=0.22,<1", "mcp>=2.1,<3"]

[project.scripts]
agenttrace-gate = "agenttrace_otel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
